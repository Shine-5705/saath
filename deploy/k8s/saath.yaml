# Deploy to any Kubernetes cluster that has the NudgeBee agent installed
# (https://docs.nudgebee.com). NudgeBee then watches this workload's events,
# restarts, OOMs and resource usage, and NuBi can troubleshoot it.
apiVersion: v1
kind: Secret
metadata: { name: saath-keys }
stringData:
  SARVAM_API_KEY: "replace-me"
  FLAGSMITH_ENVIRONMENT_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: saath, labels: { app: saath } }
spec:
  replicas: 1
  selector: { matchLabels: { app: saath } }
  template:
    metadata:
      labels: { app: saath }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8797", prometheus.io/path: "/metrics" }
    spec:
      containers:
        - name: app
          image: ghcr.io/shine-5705/saath:latest
          ports: [{ containerPort: 8797 }]
          envFrom: [{ secretRef: { name: saath-keys } }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: 8797 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8797 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: saath }
spec: { selector: { app: saath }, ports: [{ port: 80, targetPort: 8797 }] }
